[options]
install_requires =
    file:requirements.txt
    attr:mypkg.__version__
    ${REQ_VERSION}
    %(REQ_VERSION)s
    ./local/pkg
    ../sibling/pkg
    /abs/path/pkg
    git+https://github.com/org/repo.git
    https://example.com/pkg.tar.gz
    -e ./editable/pkg
    -e git+https://github.com/org/repo.git#egg=mypkg
    requests==2.31.0

[options.extras_require]
dev =
    file:dev-requirements.txt
    pytest>=7
